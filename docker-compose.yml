services:
  db:
    image: postgres:16-alpine
    container_name: power-builder-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: power_builder
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d power_builder"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: power-builder-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/power_builder
      ENVIRONMENT: development
      PUBLIC_API_URL: http://localhost:8000
      BIND_HOST: 0.0.0.0
      BIND_PORT: "8000"
      HTTPS_ENABLED: "false"
      SESSION_TIMEOUT_SECONDS: "3600"
      REQUEST_TIMEOUT_SECONDS: "3600"
      TRANSACTION_TIMEOUT_SECONDS: "120"
      LICENSE_REQUIRED: "false"
      PSR_FIXTURES_ROOT: /fixtures/psr
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./apps/backend:/app
      - ./fixtures:/fixtures:ro
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --timeout-keep-alive 3600

volumes:
  postgres_data:
